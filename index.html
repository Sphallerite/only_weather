<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Only The Weather" />
    <title>Only Weather</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/weather/partly-cloudy.svg" />
  </head>

  <body>
    <div class="page-wrapper">
      <header>
        <div class="container">
          <button id="temp-unit-button" class="button item glow-shadow" type="button">
            <div class="button-text" id="temp-unit-button-text">F</div>
          </button>
          <form role="search" class="container search-container" id="searchbar" autocomplete="off">
            <input
              class="item glow-shadow"
              id="searchbox"
              type="search"
              placeholder="Search City..."
            />
            <button class="button item glow-shadow" type="submit" id="searchbox-submit-button">
              <img class="icon" src="assets/icons/search.svg" alt="" />
            </button>
            <div class="search-results-wrapper card glow-shadow hide" id="search-results-wrapper">
              <template id="loading-image-template">
                <img class="loading-image" src="assets/images/loading.gif" />
              </template>
              <template class="search-result-template" id="search-result-template">
                ><button type="button" class="search-result">
                  <span class="city-name"></span>
                </button>
              </template>
            </div>
          </form>
        </div>
      </header>
      <main>
        <div class="widget-container">
          <div class="card glow-shadow" id="main-widget">
            <div class="location" id="main-location"></div>
            <div class="date" id="main-date" hidden></div>
            <hr />
            <div class="temperatures">
              <div class="temp" id="main-temp"></div>
              <div class="feels-block">
                <div class="feels-block-2">
                  <div class="feels">Feels</div>
                  <div class="feels-temp" id="feels-temp"></div>
                </div>
              </div>
            </div>
            <img class="emoji" id="main-emoji" src="assets/icons/unloaded.svg" alt="" />
            <div class="info-block">
              <div class="info-text" id="percipitation-info">
                <div class="info-name">Percipitation</div>
                <div class="info" id="main-percipitation"></div>
              </div>
              <div class="info-text" id="humidity-info">
                <div class="info-name">Humidity</div>
                <div class="info" id="main-humidity"></div>
              </div>
              <div class="info-text" id="wind-info">
                <div class="info-name">Wind</div>
                <div class="info" id="main-wind"></div>
              </div>
            </div>
          </div>
          <div class="card glow-shadow" id="graph-widget">
            <div class="graph-menu">
              <button class="graph-menu-button glow-shadow" id="temperature-graph-menu-button">
                Temperature
              </button>
              <button class="graph-menu-button glow-shadow" id="precipitation-graph-menu-button">
                Precipitation
              </button>
            </div>
            <div class="legend range-legend">
              <span class="legend-text" id="legend-text-100"></span>
              <span class="legend-text" id="legend-text-66"></span>
              <span class="legend-text" id="legend-text-33"></span>
              <span class="legend-text" id="legend-text-0"></span>
            </div>
            <div class="bar-box glow-shadow" id="bar-box">
              <div class="temp-label" id="temp-label"></div>
              <div class="lines">
                <div class="line glow-shadow"></div>
                <div class="line glow-shadow"></div>
                <div class="line glow-shadow"></div>
                <div class="line glow-shadow"></div>
                <div class="line glow-shadow"></div>
              </div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
            </div>
            <div class="spacer"></div>
            <div class="legend time-legend">
              <span class="legend-text">12</span>
              <span class="legend-text">3</span>
              <span class="legend-text">6</span>
              <span class="legend-text">9</span>
              <span class="legend-text">12</span>
              <span class="legend-text">3</span>
              <span class="legend-text">6</span>
              <span class="legend-text">9</span>
            </div>
          </div>
        </div>
        <div class="day-container">
          <button class="day card glow-shadow" id="day0" type="button">
            <div class="day-date"></div>
            <div class="day-icon-and-temps">
              <img class="day-icon" src="assets/icons/unloaded.svg" alt="" />
              <div class="hilo">
                <div class="day-temp lo"></div>
                <div class="day-temp hi"></div>
              </div>
            </div>
          </button>
          <button class="day card glow-shadow" id="day1" type="button">
            <div class="day-date"></div>
            <div class="day-icon-and-temps">
              <img class="day-icon" src="assets/icons/unloaded.svg" alt="" />
              <div class="hilo">
                <div class="day-temp lo"></div>
                <div class="day-temp hi"></div>
              </div>
            </div>
          </button>
          <button class="day card glow-shadow" id="day2" type="button">
            <div class="day-date"></div>
            <div class="day-icon-and-temps">
              <img class="day-icon" src="assets/icons/unloaded.svg" alt="" />
              <div class="hilo">
                <div class="day-temp lo"></div>
                <div class="day-temp hi"></div>
              </div>
            </div>
          </button>
          <button class="day card glow-shadow" id="day3" type="button">
            <div class="day-date"></div>
            <div class="day-icon-and-temps">
              <img class="day-icon" src="assets/icons/unloaded.svg" alt="" />
              <div class="hilo">
                <div class="day-temp lo"></div>
                <div class="day-temp hi"></div>
              </div>
            </div>
          </button>
          <button class="day card glow-shadow" id="day4" type="button">
            <div class="day-date"></div>
            <div class="day-icon-and-temps">
              <img class="day-icon" src="assets/icons/unloaded.svg" alt="" />
              <div class="hilo">
                <div class="day-temp lo"></div>
                <div class="day-temp hi"></div>
              </div>
            </div>
          </button>
          <button class="day card glow-shadow" id="day5" type="button">
            <div class="day-date"></div>
            <div class="day-icon-and-temps">
              <img class="day-icon" src="assets/icons/unloaded.svg" alt="" />
              <div class="hilo">
                <div class="day-temp lo"></div>
                <div class="day-temp hi"></div>
              </div>
            </div>
          </button>
          <button class="day card glow-shadow" id="day6" type="button">
            <div class="day-date"></div>
            <div class="day-icon-and-temps">
              <img class="day-icon" src="assets/icons/unloaded.svg" alt="" />
              <div class="hilo">
                <div class="day-temp lo"></div>
                <div class="day-temp hi"></div>
              </div>
            </div>
          </button>
        </div>
      </main>
      <footer></footer>
    </div>
  </body>

  <script type="module" src="js/main.js"></script>
</html>
