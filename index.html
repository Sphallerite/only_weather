<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Just the Weather" />
    <title>Just The Weather</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <header>
        <div class="container top-container">
          <button class="button item" type="button">
            <div class="text-icon">°F</div>
          </button>
          <button class="button item" type="button">
            <img class="icon" src="assets/icons/dark-mode.svg" alt="" />
          </button>
          <form role="search" class="container" id="search-container">
            <input
              class="item"
              id="searchbox"
              type="search"
              placeholder="Search City..."
            />
            <button class="button item" type="submit">
              <img class="icon" src="assets/icons/search.svg" alt="" />
            </button>
          </form>
        </div>
      </header>
      <main>
        <div class="widget-container">
          <div id="main-widget"></div>
          <div id="graph-widget"></div>
        </div>
        <div class="day-container">
          <div class="day" id="day0">
            <div class="day-item-date">Today</div>
            <img class="day-icon" src="assets/icons/sunny.svg" alt="" />
            <div class="day-item-temp">52°L 68°H</div>
          </div>
          <div class="day" id="day1">
            <div class="day-item-date">Sat</div>
            <img class="day-icon" src="assets/icons/sunny.svg" alt="" />
            <div class="day-item-temp">52°L 68°H</div>
          </div>
          <div class="day" id="day2">
            <div class="day-item-date">Sun</div>
            <img class="day-icon" src="assets/icons/rainy.svg" alt="" />
            <div class="day-item-temp">52°L 68°H</div>
          </div>
          <div class="day" id="day3">
            <div class="day-item-date">Mon</div>
            <img class="day-icon" src="assets/icons/rainy.svg" alt="" />
            <div class="day-item-temp">52°L 68°H</div>
          </div>
          <div class="day" id="day4">
            <div class="day-item-date">Tue</div>
            <img class="day-icon" src="assets/icons/rainy.svg" alt="" />
            <div class="day-item-temp">52°L 68°H</div>
          </div>
          <div class="day" id="day5">
            <div class="day-item-date">Wed</div>
            <img class="day-icon" src="assets/icons/rainy.svg" alt="" />
            <div class="day-item-temp">52°L 68°H</div>
          </div>
          <div class="day" id="day6">
            <div class="day-item-date">Thu</div>
            <img class="day-icon" src="assets/icons/rainy.svg" alt="" />
            <div class="day-item-temp">52°L 68°H</div>
          </div>
          <div class="day" id="day7">
            <div class="day-item-date">Fri</div>
            <img class="day-icon" src="assets/icons/rainy.svg" alt="" />
            <div class="day-item-temp">52°L 68°H</div>
          </div>
        </div>
      </main>
      <footer>
        <div class="container"></div>
      </footer>
    </div>
  </body>
</html>
