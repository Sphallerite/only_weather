<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Just the Weather" />
    <title>Just The Weather</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <script src="js/script.js"></script>

  <body>
    <div class="page-wrapper">
      <header>
        <div class="container">
          <button class="button item" type="button">
            <div class="button-text">°F</div>
          </button>
          <button class="button item" type="button">
            <img class="icon" src="assets/icons/dark-mode.svg" alt="" />
          </button>
          <form role="search" class="container" id="search-container">
            <input
              class="item"
              id="searchbox"
              type="search"
              placeholder="Search City..."
            />
            <button class="button item" type="submit">
              <img class="icon" src="assets/icons/search.svg" alt="" />
            </button>
          </form>
        </div>
      </header>
      <main>
        <div class="widget-container">
          <div class="card" id="main-widget">
            <div class="auto-pad-main-widget">
              <div>
                <div class="location">Port Orange, FL</div>
                <div class="temp">52°</div>
              </div>
              <img class="emoji" src="assets/icons/sunny.svg" alt="" />
            </div>
          </div>
          <div class="card" id="graph-widget"></div>
        </div>
        <div class="day-container">
          <button class="day card" id="day0" type="button">
            <div class="day-item-date">Fri 24</div>
            <img class="day-icon" src="assets/icons/sunny.svg" alt="" />
            <div>
              <div class="day-temp hi">68°H</div>
              <div class="day-temp lo">52°L</div>
            </div>
          </button>
          <button class="day card" id="day1" type="button">
            <div class="day-item-date">Sat 25</div>
            <img class="day-icon" src="assets/icons/sunny.svg" alt="" />
            <div>
              <div class="day-temp hi">68°H</div>
              <div class="day-temp lo">52°L</div>
            </div>
          </button>
          <button class="day card" id="day2" type="button">
            <div class="day-item-date">Sun 26</div>
            <img class="day-icon" src="assets/icons/rainy.svg" alt="" />
            <div>
              <div class="day-temp hi">68°H</div>
              <div class="day-temp lo">52°L</div>
            </div>
          </button>
          <button class="day card" id="day3" type="button">
            <div class="day-item-date">Mon 27</div>
            <img class="day-icon" src="assets/icons/rainy.svg" alt="" />
            <div>
              <div class="day-temp hi">68°H</div>
              <div class="day-temp lo">52°L</div>
            </div>
          </button>
          <button class="day card" id="day4" type="button">
            <div class="day-item-date">Tue 28</div>
            <img class="day-icon" src="assets/icons/rainy.svg" alt="" />
            <div>
              <div class="day-temp hi">68°H</div>
              <div class="day-temp lo">52°L</div>
            </div>
          </button>
          <button class="day card" id="day5" type="button">
            <div class="day-item-date">Wed 29</div>
            <img class="day-icon" src="assets/icons/rainy.svg" alt="" />
            <div>
              <div class="day-temp hi">68°H</div>
              <div class="day-temp lo">52°L</div>
            </div>
          </button>
          <button class="day card" id="day6" type="button">
            <div class="day-item-date">Thu 30</div>
            <img class="day-icon" src="assets/icons/rainy.svg" alt="" />
            <div>
              <div class="day-temp hi">68°H</div>
              <div class="day-temp lo">52°L</div>
            </div>
          </button>
          <button class="day card" id="day7" type="button">
            <div class="day-item-date">Fri 31</div>
            <img class="day-icon" src="assets/icons/rainy.svg" alt="" />
            <div>
              <div class="day-temp hi">68°H</div>
              <div class="day-temp lo">52°L</div>
            </div>
          </button>
        </div>
      </main>
      <footer>
        <div>
          <div class="stupid" hidden>
            <img class="clouds" src="assets/images/dancing-clouds.gif" alt="" />
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
